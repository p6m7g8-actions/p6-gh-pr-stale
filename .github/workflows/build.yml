name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches:
      - gh-readonly-queue/**
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  # github.event_name is part of the key because for a merge_group event
  # github.ref IS the refs/heads/gh-readonly-queue/... ref, and
  # github.event.pull_request.number is empty for both merge_group and the
  # queue-ref push above. Without it, the two runs for one queue entry share a
  # group and cancel-in-progress cancels one of them; a cancelled required
  # check reads as a failure to the queue, which is the dequeue this rider
  # exists to prevent.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: p6m7g8-actions/p6-build@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  lint_pr_title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Skip PR title lint in queue context
        if: github.event_name == 'merge_group' || github.event_name == 'push'
        run: echo "No PR title on a queue ref; marking check successful."
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        uses: p6m7g8-actions/p6-gh-pr-title-linter@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
